[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgpu"
version = "0.16.0"
description = "An agent-oriented dataflow DSL for GPU computation pipelines in LLM inference runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "lark>=1.3.1",
]

[project.scripts]
flowgpu = "compiler.cli:main"
flowgpu-migration = "migration.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "ruff>=0.5",
    "build>=1",
]

[tool.setuptools.packages.find]
include = ["compiler*", "migration*"]

[tool.setuptools.package-data]
compiler = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["compiler"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Calibrated conservatively for the first CI run; raise it once the
# baseline is published in the CI history.  The suite executes emitted
# source through the CPU Triton double, so coverage tracks real paths.
fail_under = 55

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# Start with the rules that must never be red: syntax errors and
# undefined/duplicate names.  Widen the set deliberately once the
# baseline is green in CI.
select = ["E9", "F63", "F7", "F82"]
