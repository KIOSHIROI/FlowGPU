[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgpu"
version = "0.21.6"
description = "A dataflow DSL compiler for GPU operator pipelines targeting Triton and a portable reference backend"
authors = [{name = "The FlowGPU Authors"}]
keywords = ["compiler", "triton", "dataflow", "dsl", "gpu", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "lark>=1.3.1",
]

[project.scripts]
flowgpu = "flowgpu.compiler.cli:main"
flowgpu-migration = "flowgpu.migration.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "ruff>=0.5",
    "build>=1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
]

[project.urls]
Homepage = "https://github.com/KIOSHIROI/FlowGPU"
Repository = "https://github.com/KIOSHIROI/FlowGPU"
Documentation = "https://kioshiroi.github.io/FlowGPU/"
Issues = "https://github.com/KIOSHIROI/FlowGPU/issues"
Changelog = "https://github.com/KIOSHIROI/FlowGPU/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["flowgpu*"]

[tool.setuptools.package-data]
"flowgpu.compiler" = ["*.lark"]
"flowgpu.migration" = ["data/*.json"]
flowgpu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["flowgpu.compiler"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Calibrated conservatively for the first CI run; raise it once the
# baseline is published in the CI history.  The suite executes emitted
# source through the CPU Triton double, so coverage tracks real paths.
fail_under = 55

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# Start with the rules that must never be red: syntax errors and
# undefined/duplicate names.  Widen the set deliberately once the
# baseline is green in CI.
select = ["E9", "F63", "F7", "F82"]
