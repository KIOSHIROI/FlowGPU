name: Feature request
about: Suggest a compiler, backend or documentation improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to express or diagnose today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: A minimal DSL program or API sketch, if possible.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
