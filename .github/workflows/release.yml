name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: verify tag matches package version
        run: |
          python - <<'PY'
          import tomllib, os
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert version == tag, f"pyproject version {version} != tag {tag}"
          PY
      - name: build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: install wheel in a clean venv
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import compiler
          from compiler import compile_source
          result = compile_source("pipeline p { input x:fp16[64] input y:fp16[64] out = add(x, y) output out }")
          print("wheel import ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
          retention-days: 90
