name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ensure the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: verify tag matches package version
        run: |
          python - <<'PY'
          import tomllib, os
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert version == tag, f"pyproject version {version} != tag {tag}"
          PY
      - name: build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: install wheel in a clean venv
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import flowgpu.compiler
          from flowgpu.compiler import compile_source
          result = compile_source("pipeline p { input x:fp16[64] input y:fp16[64] out = add(x, y) output out }")
          print("wheel import ok")
          PY
      - name: check distribution metadata
        run: |
          python -m pip install twine
          python tools/check_release_metadata.py --dist dist
          python -m twine check dist/*
      - name: generate checksums
        run: (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
          retention-days: 90
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
