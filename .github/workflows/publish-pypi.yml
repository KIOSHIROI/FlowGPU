name: publish-pypi

# Manual and guarded. Configure a PyPI trusted publisher for this repository and
# the `pypi` environment before using it. Tag pushes only build artifacts.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm the release decision'
        required: true
      tag:
        description: 'Existing tag to publish (e.g. v0.16.1)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: require explicit confirmation
        run: |
          test "${{ inputs.confirm }}" = "publish" || {
            echo "refusing to publish: confirmation input must be exactly 'publish'"
            exit 1
          }
  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify tag matches package version
        run: |
          python - <<'PY'
          import tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert version == "${{ inputs.tag }}".lstrip("v"), version
          PY
      - name: build and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
