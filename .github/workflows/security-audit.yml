name: security-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: build the wheel
        run: |
          python -m pip install --upgrade pip build pip-audit
          python -m build --wheel
      - name: install wheel in a clean runtime environment
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/python -m pip install --upgrade pip
          /tmp/runtime/bin/python -m pip install dist/*.whl
      - name: audit runtime dependencies
        run: |
          SITE=$(/tmp/runtime/bin/python -c "import site; print(site.getsitepackages()[0])")
          pip-audit --path "$SITE" --format columns --progress-spinner off
          pip-audit --path "$SITE" --format cyclonedx-json --progress-spinner off > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-sbom
          path: sbom.cdx.json
          retention-days: 90
