name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly maintenance run: the suite must stay green even without pushes.
    - cron: "23 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cpu-tests-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: lint
        run: python -m ruff check .
      - name: public CPU suite with coverage gate
        run: |
          python -m pytest -q --junitxml=pytest.xml \
            --cov=compiler --cov-report=xml:coverage.xml
      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python }}
          path: |
            pytest.xml
            coverage.xml

  docs:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: check relative links
        run: python tools/check_docs_links.py
      - name: build docs strictly
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  wheel:
    name: build-wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: install wheel in a clean venv
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import compiler
          from compiler import compile_source
          result = compile_source("pipeline p { input x:fp16[64] input y:fp16[64] out = add(x, y) output out }")
          assert result.pipelines[0].triton.complete
          print("wheel import ok")
          PY
      - name: install sdist in a clean venv
        run: |
          python -m venv /tmp/sdistcheck
          /tmp/sdistcheck/bin/python -m pip install dist/*.tar.gz
          /tmp/sdistcheck/bin/python - <<'PY'
          from compiler import __version__, compile_source
          result = compile_source("pipeline p { input x:fp16[4] input y:fp16[4] out = add(x, y) output out }")
          assert result.pipelines[0].triton.complete
          print("sdist import ok", __version__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
