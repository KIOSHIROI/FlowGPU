name: publish-testpypi

# Manual and guarded. Configure a TestPyPI trusted publisher for project
# `flowgpu`, this repository, this workflow file and the `testpypi` environment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm the test-index decision'
        required: true
      tag:
        description: 'Existing tag to publish (e.g. vX.Y.Z)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: require explicit confirmation
        run: |
          test "${{ inputs.confirm }}" = "publish" || {
            echo "refusing to publish: confirmation input must be exactly 'publish'"
            exit 1
          }
  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: ensure the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify tag matches package version
        run: |
          python - <<'PY'
          import tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert version == "${{ inputs.tag }}".lstrip("v"), version
          PY
      - name: build and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
