site_name: FlowGPU
site_url: https://kioshiroi.github.io/FlowGPU/
site_description: A dataflow DSL compiler for GPU operator pipelines
repo_url: https://github.com/KIOSHIROI/FlowGPU
repo_name: KIOSHIROI/FlowGPU
edit_uri: edit/main/docs/user-guide/
docs_dir: docs/user-guide
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tutorial: tutorial.md
  - Examples: examples.md
  - Language: language.md
  - CLI: cli.md
  - Python API: api.md
  - Python integration: integration.md
  - Prepared deployment: deployment.md
  - Token generation: token-generation.md
  - Continuous batching: continuous-batching.md
  - Prefill + decode: prefill-decode.md
  - MLP performance: mlp-performance.md
  - Real Llama 3 MLP: real-llama3-mlp.md
  - Container image: container.md
  - Backends: backends.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Optimization pipeline: optimization.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md
  - Competitive roadmap: competitive-roadmap.md
  - Competitive summary: competitive-summary.md
  - FlagOS/FlagGems baseline: competitive-flagos.md
  - Competitive M2 H100 result: competitive-m2-h100.md
  - Operator coverage: operator-coverage.md
  - Stability and versioning: stability.md
  - Upgrading from pre-0.18: upgrading.md
  - Releasing: releasing.md
  - Security: security.md
  - Limitations: limitations.md
